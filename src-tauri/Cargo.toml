[package]
name = "quan-voice"
version = "0.1.0"
description = "Quan Voice - Offline Voice. Unlimited Focus."
authors = ["Quan Voice Team"]
license = "Proprietary"
repository = ""
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "process", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
cpal = "0.16"
hound = "3.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
